<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Insurance Zone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#000; --white:#fff;
    --gray-100:#f0f0ec; --gray-200:#e2e2de; --gray-400:#8a8a85; --gray-500:#6a6a65; --gray-700:#2e2e2b;
    --accent:#315b7a; --accent-hover:#254d3e; --accent-light:#c8dcd4; --accent-pale:#eef4f1;
    --line:#e2e2de; --bg:#f7f7f5;
    --font-main:'DM Sans',sans-serif; --font-serif:'Cormorant Garamond',serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:var(--font-main);background:var(--black);color:var(--black);font-weight:300;display:flex;flex-direction:column;min-height:100vh;}

  /* NOISE TEXTURE */
  body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.35;}

  /* BACK LINK */
  .back-bar{position:fixed;top:0;left:0;right:0;z-index:10;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:rgba(255,255,255,0.45);text-decoration:none;font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s;}
  .back-link:hover{color:#fff;}
  .back-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .back-logo-img{height:44px;width:auto;display:block;}

  /* LAYOUT */
  .page{flex:1;display:flex;align-items:center;justify-content:center;padding:5rem 1.5rem 2rem;position:relative;z-index:1;}

  /* CARD */
  .card{background:#fff;border-radius:20px;padding:2.75rem;width:100%;max-width:460px;box-shadow:0 24px 80px rgba(0,0,0,0.35);border:1px solid rgba(200,220,212,0.15);}

  /* LOGO IN CARD */
  .card-logo{text-align:center;margin-bottom:2rem;}
  .card-logo-mark{display:flex;align-items:center;justify-content:center;width:fit-content;margin:0 auto 1rem;padding:10px 20px;background:var(--black);border-radius:14px;}
  .card-logo-mark img{height:56px;width:auto;display:block;}
  .card-logo h1{font-family:var(--font-serif);font-size:1.5rem;font-weight:400;color:var(--black);}
  .card-logo p{font-size:0.82rem;color:var(--gray-400);margin-top:4px;letter-spacing:0.06em;}

  /* TABS */
  .tabs{display:flex;background:var(--gray-100);border-radius:100px;padding:4px;margin-bottom:2rem;gap:4px;}
  .tab{flex:1;text-align:center;padding:9px;border-radius:100px;font-size:0.78rem;font-weight:400;cursor:pointer;transition:all 0.25s;color:var(--gray-400);border:none;background:transparent;font-family:var(--font-main);letter-spacing:0.06em;text-transform:uppercase;}
  .tab.active{background:#fff;color:var(--black);box-shadow:0 1px 6px rgba(0,0,0,0.08);}

  /* FORM */
  .tab-content{display:none;}
  .tab-content.active{display:block;}
  .role-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;}
  .rbadge{padding:5px 14px;border-radius:100px;font-size:0.72rem;font-weight:400;border:1px solid;cursor:default;letter-spacing:0.06em;text-transform:uppercase;}
  .rbadge.admin{background:#fee2e2;border-color:#fca5a5;color:#991b1b;}
  .rbadge.manager{background:#fef3c7;border-color:#fcd34d;color:#92400e;}
  .rbadge.staff{background:var(--accent-pale);border-color:var(--accent-light);color:var(--accent);}

  .form-group{margin-bottom:1rem;}
  .form-group label{display:block;font-size:0.72rem;font-weight:400;color:var(--gray-500);margin-bottom:6px;letter-spacing:0.1em;text-transform:uppercase;}
  .form-group input{width:100%;padding:11px 15px;border:1.5px solid var(--line);border-radius:100px;font-size:0.9rem;font-family:var(--font-main);transition:border-color 0.2s;background:var(--bg);color:var(--black);outline:none;font-weight:300;}
  .form-group input:focus{border-color:var(--accent);background:#fff;}

  .error-banner{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:10px 14px;font-size:0.82rem;margin-bottom:1rem;display:none;}
  .error-banner.show{display:block;}

  .submit-btn{width:100%;background:var(--black);color:#fff;padding:13px;border-radius:100px;font-size:0.82rem;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;border:none;cursor:pointer;font-family:var(--font-main);transition:all 0.2s;margin-top:0.5rem;display:flex;align-items:center;justify-content:center;gap:8px;}
  .submit-btn:hover{background:var(--gray-700);}
  .submit-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .divider{text-align:center;font-size:0.75rem;color:var(--gray-400);margin:1.25rem 0;letter-spacing:0.06em;}

  /* FOOTER NOTE */
  .page-footer{text-align:center;padding:1.5rem;color:rgba(255,255,255,0.25);font-size:0.75rem;letter-spacing:0.04em;position:relative;z-index:1;}

  /* TOAST */
  .toast{position:fixed;bottom:2rem;right:2rem;background:var(--black);color:#fff;padding:12px 20px;border-radius:100px;font-size:0.82rem;transform:translateY(80px);opacity:0;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);z-index:9999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,0.2);border:1px solid rgba(200,220,212,0.15);}
  .toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="back-bar">
  <a href="index.html" class="back-link">← Back to website</a>
  <a href="index.html" class="back-logo">
    <img src="images/insurance-zone-logo.png" alt="Insurance Zone" class="back-logo-img">
  </a>
</div>

<!-- LOGIN CARD -->
<div class="page">
  <div class="card">
    <div class="card-logo">
      <div class="card-logo-mark">
        <img src="images/insurance-zone-logo.png" alt="Insurance Zone">
      </div>
      <h1>Insurance Zone</h1>
      <p>Secure employee access portal</p>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('staff')">Staff Login</button>
      <button class="tab" onclick="switchTab('admin')">Admin Login</button>
    </div>

    <!-- STAFF TAB -->
    <div class="tab-content active" id="tabStaff">
      <div class="role-row">
        <span class="rbadge manager">Manager</span>
        <span class="rbadge staff">Staff</span>
      </div>
      <div class="error-banner" id="staffErr"></div>
      <div class="form-group">
        <label>Work Email</label>
        <input type="email" id="staffEmail" placeholder="name@insurancezone.co.in" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="staffPass" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') loginStaff()">
      </div>
      <button class="submit-btn" id="staffBtn" onclick="loginStaff()">
        <span>Sign In</span>
      </button>
    </div>

    <!-- ADMIN TAB -->
    <div class="tab-content" id="tabAdmin">
      <div class="role-row">
        <span class="rbadge admin">Administrator</span>
      </div>
      <div class="error-banner" id="adminErr"></div>
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" placeholder="admin@insurancezone.co.in" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="adminPass" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') loginAdmin()">
      </div>
      <button class="submit-btn" id="adminBtn" onclick="loginAdmin()">
        <span>Admin Sign In</span>
      </button>
    </div>
  </div>
</div>

<div class="page-footer">© 2026 Insurance Zone Pvt. Ltd. · Secure Portal</div>
<div class="toast" id="toast"><span>✦</span><span id="toastMsg"></span></div>

<script>
const API = 'https://assistant-babbie-jswlom-5f9eef0d.koyeb.app';

// ── If already logged in, go straight to dashboard ───────────
(function() {
  const token = localStorage.getItem('iz_access');
  const user  = localStorage.getItem('iz_user');
  if (token && user) window.location.href = 'dashboard.html';
})();

// ── Tab switching ─────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) =>
    t.classList.toggle('active', (tab === 'staff' && i === 0) || (tab === 'admin' && i === 1))
  );
  document.getElementById('tabStaff').classList.toggle('active', tab === 'staff');
  document.getElementById('tabAdmin').classList.toggle('active', tab === 'admin');
  ['staffErr', 'adminErr'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.className = 'error-banner'; el.textContent = ''; }
  });
}

// ── Login handlers ────────────────────────────────────────────
async function loginStaff() {
  const email = document.getElementById('staffEmail').value.trim();
  const pass  = document.getElementById('staffPass').value;
  if (!email || !pass) { showErr('staffErr', 'Please enter your email and password.'); return; }
  await doLogin(email, pass, 'staffBtn', 'staffErr');
}

async function loginAdmin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  if (!email || !pass) { showErr('adminErr', 'Please enter admin email and password.'); return; }
  await doLogin(email, pass, 'adminBtn', 'adminErr');
}

async function doLogin(email, password, btnId, errId) {
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.innerHTML = '<span>Signing in…</span>';

  try {
    const res  = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      showErr(errId, data.detail || 'Login failed. Check your credentials.');
      btn.disabled = false;
      btn.innerHTML = '<span>Sign In</span>';
      return;
    }

    // Save tokens and user info
    localStorage.setItem('iz_access',  data.access_token);
    localStorage.setItem('iz_refresh', data.refresh_token);
    localStorage.setItem('iz_user', JSON.stringify({
      name:    data.name,
      role:    data.role,
      user_id: data.user_id,
    }));

    showToast('Welcome back, ' + data.name + ' ✦');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 600);

  } catch {
    showErr(errId, 'Network error. Is the server reachable?');
    btn.disabled = false;
    btn.innerHTML = '<span>Sign In</span>';
  }
}

// ── Helpers ───────────────────────────────────────────────────
function showErr(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'error-banner show';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
